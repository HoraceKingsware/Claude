# 美团自动登录配置文件

# 登录配置
login:
  # 美团登录页面URL
  url: "https://passport.meituan.com/account/unitivelogin"
  # 账号信息（建议使用环境变量）
  username: ""  # 手机号或邮箱
  password: ""  # 密码

# 浏览器配置
browser:
  # 浏览器类型: chromium, firefox, webkit
  type: "chromium"
  # 是否无头模式
  headless: false
  # 浏览器窗口大小
  viewport:
    width: 1920
    height: 1080
  # 用户数据目录（用于保存Cookie等）
  user_data_dir: "./browser_data"

# 反爬虫配置
anti_crawler:
  # 是否启用JavaScript混淆检测绕过
  stealth_mode: true
  # 是否随机化User-Agent
  random_user_agent: true
  # 操作延迟范围（秒）
  delay_range:
    min: 1.0
    max: 3.0
  # 是否模拟人类行为
  human_behavior: true
  # WebDriver特征隐藏
  hide_webdriver: true

# 验证码配置
captcha:
  # 验证码识别提供商: claude, manual
  provider: "claude"
  # Claude API配置
  claude:
    model: "claude-3-5-sonnet-20241022"
    max_tokens: 1024
    temperature: 0
  # 最大重试次数
  max_retries: 3
  # 超时时间（秒）
  timeout: 30

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # 日志文件路径
  file: "./logs/meituan_login.log"
  # 是否输出到控制台
  console: true
